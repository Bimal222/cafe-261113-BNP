<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まちかどカフェ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/footer.css">
</head>

<body>
  <!-- ===== A ヘッダー ここから ===== -->
  <div class="notice-bar">
    <p class="notice-bar__text">11月は、ホットドリンクが全品50円引きです。</p>
  </div>

  <header class="site-header">
    <h1 class="site-header__logo">まちかどカフェ</h1>
    <ul class="site-header__nav">
      <li><a class="site-header__link" href="#">メニュー</a></li>
      <li><a class="site-header__link" href="#">アクセス</a></li>
      <li><a class="site-header__link" href="#">お知らせ</a></li>
    </ul>
    <a class="site-header__button" href="#">予約する</a>
  </header>
  <section class="hero">
    <h2 class="hero__title">今日も、いつもの一杯を。</h2>
    <p class="hero__text">駅から歩いて3分。朝8時から開いている、町の小さなカフェです。</p>
  </section>

  <!-- ===== A ヘッダー ここまで ===== -->

  <!-- ===== B メイン ここから ===== -->
  <section class="point">
    <h2 class="point__title">まちかどカフェの3つのこだわり</h2>
    <ul class="point__list">
      <li class="point__item">毎朝、お店で豆を焙煎</li>
      <li class="point__item">牛乳は近くの牧場から</li>
      <li class="point__item">ケーキは全部手づくり</li>
    </ul>
  </section>
  <!-- ===== B メイン ここまで ===== -->

  <!-- ===== C フッター ここから ===== -->
  <footer class="site-footer">
    <p class="site-footer__name">まちかどカフェ</p>
    <ul class="site-footer__info">
      <li>営業時間　8:00〜20:00</li>
      <li>定休日　水曜日</li>
    </ul>
    <a class="site-footer__link" href="#">お問い合わせ</a>
    <p class="site-footer__copy">© 2026 まちかどカフェ</p>
  </footer>

  <!-- ===== C フッター ここまで ===== -->
  <section class="contact" id="contact">
    <h2 class="contact__title">お問い合わせ</h2>
    <form class="contact__form">
      <label class="contact__label" for="name">お名前</label>
      <input class="contact__input" type="text" id="name" name="name">
      <label class="contact__label" for="message">ご用件</label>
      <textarea class="contact__input" id="message" name="message" rows="4"></textarea>
      <button class="contact__button" type="submit">送信する</button>
    </form>
  </section>

</body>

</html>
